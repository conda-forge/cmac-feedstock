schema_version: 1

context:

  version: "0.4.3"


package:
  name: cmac
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cmac/cmac-${{ version }}.tar.gz
  sha256: e4eac55bda4117a31a0b79a3fc9f0e81bcedf0e36148614a9444b044855cffee


build:
  number: 0
  skip:
    - match(python, "<3.13")
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
  host:
    - python
    - numpy >=2
    - setuptools >=77
    - wheel
    - cython
    - pip
    - xarray
    - arm_pyart
    - scikit-fuzzy
    - wradlib
    - s3fs >=2021.11.0
  run:
    - python
    - scipy
    - matplotlib-base
    - pyyaml
    - cartopy
    - cmweather
    - netcdf4
    - distributed
    - xarray
    - arm_pyart
    - scikit-fuzzy
    - wradlib
    - s3fs >=2021.11.0

tests:
  - python:
      imports:
        - cmac
    script:
      - pip check

about:
  summary: Corrected Moments in Antenna Coordinates
  license: BSD-3-Clause
  license_file:
    - LICENSE
    - LICENSE_GPL.txt
  homepage: https://github.com/ARM-Development/cmac

extra:
  recipe-maintainers:
    - rcjackson
    - zssherman
