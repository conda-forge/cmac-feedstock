schema_version: 1

context:
  version: 0.4.0
  python_min: 3.13

package:
  name: cmac
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cmac/cmac-${{ version }}.tar.gz
  sha256: 364108624bd15a8deb67898f2888c4bc08713d08af44bd20ed2dc2be46d8d346

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
  host:
    - python ${{ python_min }}.*
    - numpy >=2
    - setuptools >=77
    - wheel
    - cython
    - pip
    - xarray
    - arm_pyart
    - scikit-fuzzy
    - wradlib
    - s3fs >=2021.11.0
  run:
    - python >=${{ python_min }}
    - scipy
    - matplotlib-base
    - pyyaml
    - cartopy
    - cmweather
    - netcdf4
    - distributed
    - xarray
    - arm_pyart
    - scikit-fuzzy
    - wradlib
    - s3fs >=2021.11.0

tests:
  - python:
      imports:
        - cmac
      python_version:
        - ${{ python_min }}.*
        - "*"
    script:
      - pip check

about:
  summary: Corrected Moments in Antenna Coordinates
  license: BSD-3-Clause
  license_file:
    - LICENSE
    - LICENSE_GPL.txt
  homepage: https://github.com/ARM-Development/cmac

extra:
  recipe-maintainers:
    - rcjackson
    - zssherman
